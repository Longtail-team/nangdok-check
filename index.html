<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>전래동화 출석체크</title>
<meta name="description" content="전래동화 출석체크">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6FA766">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<!-- iOS 홈 화면 앱 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="전래동화 출석체크">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  :root{ --brand:#6FA766; --paper:#F7F3EA; --ink:#7C766B; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--paper)}
  #load{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:var(--paper);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    text-align:center; padding:24px;
  }
  #load .ico{font-size:56px; animation:pop .9s ease infinite alternate}
  #load .txt{font-size:13.5px; color:var(--ink); letter-spacing:.01em}
  #load .bar{width:120px; height:4px; border-radius:99px; background:#ECE5D8; overflow:hidden}
  #load .bar i{display:block; width:40%; height:100%; border-radius:99px;
    background:var(--brand); animation:slide 1.1s ease-in-out infinite}
  #load a{margin-top:8px; font-size:12.5px; color:var(--brand); text-decoration:underline}
  @keyframes pop{from{transform:translateY(0)}to{transform:translateY(-8px)}}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
</head>
<body>

<div id="load">
  <div class="ico">🐯</div>
  <div class="bar"><i></i></div>
  <div class="txt">전래동화 출석체크 여는 중…</div>
  <a id="manual" href="#">안 열리면 여기를 눌러주세요</a>
</div>

<script>
(function(){
  "use strict";

  // ── 출석 앱(Apps Script) 배포 주소 ──────────────────────────────
  var EXEC = "https://script.google.com/a/macros/doingle.net/s/AKfycbx7437XL9U5fZ80NGm-61-ThGRGaVR0Bew4rPF63ogcNxRjlgxsr_3fCemt2OL_uuMwyA/exec";

  var KEY = "rd_phone_wrap";        // 이 사이트(Netlify) 기준으로 연락처 기억
  function digits(s){ return String(s||"").replace(/[^0-9]/g,""); }
  function get(){ try{ return localStorage.getItem(KEY)||""; }catch(e){ return ""; } }
  function set(v){ try{ v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY); }catch(e){} }

  // 1) 주소창 ?p= 가 있으면 최우선(개인 링크 공유용) → 기억해둠
  var url = new URL(location.href);
  var p = digits(url.searchParams.get("p"));
  if(p) set(p);
  // 2) 없으면 이전에 저장해둔 연락처 사용
  if(!p) p = get();

  // 목적지: 연락처가 있으면 ?p= 로 자동 로그인. 앱은 iframe 없이 "직접" 실행.
  var dest = EXEC + (p ? ("?p=" + encodeURIComponent(p)) : "");

  // 수동 링크(자동 이동이 막히는 드문 경우 대비)
  document.getElementById("manual").href = dest;

  // 서비스워커 등록(홈 화면 설치 가능하게)
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }

  // 잠깐 🐯 스플래시를 보여준 뒤 출석앱으로 이동(뒤로가기 루프 방지 위해 replace)
  setTimeout(function(){ location.replace(dest); }, 250);
})();
</script>
</body>
</html>
